name: PHP checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  checks:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: PHP version
      run: php -v

    - name: PHP syntax
      run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

    - name: Financial calculations
      run: php test/run_financial_tests.php

    - name: Complex-site qualification
      run: php test/run_complex_site_tests.php
